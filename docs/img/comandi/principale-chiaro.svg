<title id="titolo">Schermata principale</title>
<desc id="descrizione">Display rotondo della schermata principale: al centro la zona della creatura (tocco per la carezza, dito fermo 3 secondi per il rilascio); sopra, tratteggiati, i pulsanti evolvi e addio che compaiono solo quando servono; in basso quattro pulsanti rotondi, cibo, gioco, luce e bagnetto. Frecce: scorrimento orizzontale per il Pokédex, verso l'alto per la scheda, verso il basso per l'orologio. Il tasto PWR spegne lo schermo con una pressione breve e la scheda con 4 secondi.</desc>
