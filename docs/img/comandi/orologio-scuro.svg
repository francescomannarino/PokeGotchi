<title id="titolo">Orologio e impostazioni</title>
<desc id="descrizione">Orologio e impostazioni: in alto le schede ORA e DATA; quattro pulsanti quadrati, ora meno, ora più, minuti meno e minuti più (nella scheda DATA sei: anno, mese e giorno, meno e più); sotto, a sinistra il volume, che apre il pannello Audio, al centro i salvataggi e a destra la lingua; in basso il pulsante OK che salva data e ora. Uno scorrimento verso l'alto o verso il basso chiude senza salvare.</desc>
